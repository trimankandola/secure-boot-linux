# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-triman"
BBFILE_PATTERN_meta-triman = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-triman = "6"

LAYERDEPENDS_meta-triman = "core"
LAYERSERIES_COMPAT_meta-triman = "scarthgap"
